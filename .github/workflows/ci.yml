name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Pushes to main are never cancelled or
# dropped: each commit gets its own group (a shared group would still replace a pending run), so
# every main commit keeps a CI result (RELEASING.md relies on it before merging the version PR).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      # Dependency install scripts are skipped in every job, as in release.yml, so CI also proves
      # that build, package checks and unit tests work without them (no librdkafka binary).
      - run: npm ci --ignore-scripts
      - run: npm run lint:check
      - run: npm run check:specs
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:pkg
      - run: npm run check:pack
      - run: npm run check:workflows

  # Unit tests against the default devDependencies (NestJS 12). Jest loads the ESM-only NestJS 12
  # packages through require(esm) only on Node 24.9+, so this job runs on Node 24 alone.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --version
      - run: node -p "require('@nestjs/core/package.json').version"
      - run: npm run test:cov

  # Unit tests against NestJS 11 (still a supported peer) on every supported Node line.
  test-nest11:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Install the root devDependencies with Node 24 (some, such as @changesets/cli and undici,
      # declare a newer Node than 20), swap in the NestJS 11 line, then run the tests on the
      # matrix Node.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts @nestjs/common@^11 @nestjs/core@^11 @nestjs/testing@^11 @nestjs/terminus@^11
      - name: Switch to Node ${{ matrix.node }}
        if: matrix.node != 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      # Fails the job unless the NestJS 11 line is really installed.
      - run: node -e "const v = require('@nestjs/core/package.json').version; console.log(v); if (!v.startsWith('11.')) process.exit(1)"
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # The e2e suite talks to a real broker, so it needs the native binding: run only this
      # package's install script (node-pre-gyp downloads the prebuilt librdkafka binary).
      - run: npm rebuild @confluentinc/kafka-javascript
      - run: npm run build
      # ubuntu runners ship Docker, so testcontainers works out of the box.
      - run: npm run test:e2e

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Install the root devDependencies with Node 24, as in `test-nest11`, then build, pack and run
      # the smoke fixtures on the matrix Node.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Switch to Node ${{ matrix.node }}
        if: matrix.node != 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      # The fixtures install the packed tarball with install scripts, so each one fetches the
      # librdkafka binary for the matrix Node.
      - run: node scripts/smoke.mjs

  # Single required status check for branch protection: fails unless every job above succeeded.
  # Branch protection counts a skipped required check as passing, so this job must never be
  # skipped: without an `if` a failed need would skip it, and with `!cancelled()` a cancelled run
  # would. `always()` makes it run (and fail) whenever a need failed, was skipped, timed out or
  # was cancelled. A pull request run superseded by a newer push therefore shows a red `ci-ok` on
  # its old commit; that is harmless, because branch protection checks the head commit, whose own
  # run reports `ci-ok`. `npm run check:workflows` guards the `if` and the `needs` list.
  ci-ok:
    if: always()
    needs: [checks, test, test-nest11, e2e, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required CI job did not succeed (result: $r)"
              exit 1
            fi
          done
